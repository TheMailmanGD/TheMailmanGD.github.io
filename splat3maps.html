<form id="form">
  <select id="rule1">
    <option value="Splat Zones">Splat Zones</option>
    <option value="Tower Control" selected>Tower Control</option>
    <option value="Rainmaker">Rainmaker</option>
    <option value="Clam Blitz">Clam Blitz</option>
  </select>
  <select id="rule2">
    <option value="Splat Zones">Splat Zones</option>
    <option value="Tower Control">Tower Control</option>
    <option value="Rainmaker" selected>Rainmaker</option>
    <option value="Clam Blitz">Clam Blitz</option>
  </select>
  <button type="submit">Submit</button>
</form>
<div id="output"></div>
<script>
  document.getElementById("form").addEventListener("submit", async function(event) {
    event.preventDefault();
    const rule1 = document.getElementById("rule1").value;
    const rule2 = document.getElementById("rule2").value;
    const response = await fetch("https://splatoon3.ink/data/schedules.json");
    const awesome = await response.json();
    const output = document.getElementById("output");
    output.innerHTML = "";

    for (let i = 0; i < awesome.data.bankaraSchedules.nodes.length; i++) {
      const node = awesome.data.bankaraSchedules.nodes[i];
      const setting = node.bankaraMatchSettings?.[0];
      const ruleName = setting?.vsRule?.name;

      if (ruleName === rule1 || ruleName === rule2) {
        const stage1 = setting.vsStages[0]?.name;
        const image1 = setting.vsStages[0]?.image?.url;
        const stage2 = setting.vsStages[1]?.name;
        const image2 = setting.vsStages[1]?.image?.url;
        const startTime = new Date(new Date(node.startTime).getTime())
          .toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short' });

        output.innerHTML += `
          <p>
            ${startTime}<br>
            ${ruleName}<br>
            Stage 1: ${stage1}<br>
            <img width="100" src="${image1}" alt="${stage1}"><br>
            Stage 2: ${stage2}<br>
            <img width="100" src="${image2}" alt="${stage2}"><br>
          </p>
        `;
      }
    }
  });

loadText("https://splatoon3.ink/data/schedules.json");
</script>
