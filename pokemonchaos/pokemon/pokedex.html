<!DOCTYPE html>
<html lang="en">
    <!-- Get information from movesets.js -->
    <script src="JSON/Movesets/movesets.js"></script>
    <!-- Get moves information -->
    <script src="JSON/moves.js"></script>
    <script>
        // Get the pokemon name from the URL query parameter
        var pkm = new URLSearchParams(window.location.search).get('pokemon');

        var pokemonName = pkm.toLowerCase();
        var pokemonObj = window[pokemonName];
        var levelupmoveset = pokemonObj.levelup;
        function onload() {
            moveset();
            createmovesettable();
        }
        function moveset() {

            var movesetText = JSON.stringify(levelupmoveset);
            document.getElementById("test").innerText = movesetText;
        }

        function createmovesettable() {
            const container = document.getElementById("movelist");
            for (let level in levelupmoveset) {
                const moves = levelupmoveset[level];
                const moveNames = moves.join(", ");
                const tr = document.createElement("tr");
                const tdLevel = document.createElement("td");
                tdLevel.innerText = level;
                const tdMoves = document.createElement("td");
                tdMoves.innerText = moveNames;
                const tdType = document.createElement("td");
                const tdCategory = document.createElement("td");
                const tdPower = document.createElement("td");
                const tdAccuracy = document.createElement("td");
                tr.appendChild(tdLevel);
                tr.appendChild(tdMoves);
                tr.appendChild(tdType);
                tr.appendChild(tdCategory);
                tr.appendChild(tdPower);
                tr.appendChild(tdAccuracy);
                container.appendChild(tr);
            }
        }
        window.addEventListener('load', onload);
    </script>
    <body>
        <div id="testtable">
            <table>
                <tr>
                    <th>Level</th>
                    <th>Move</th>
                    <th>Type</th>
                    <th>Category</th>
                    <th>Power</th>
                    <th>Accuracy</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td>Tackle</td>
                    <td>Normal</td>
                    <td>Physical</td>
                    <td>40</td>
                    <td>100%</td>
                </tr>
        </div>
        <p id="test">uh oh</p>
        <div id="movelist">
            <tr>
                <th>Level</th>
                <th>Move</th>
                <th>Type</th>
                <th>Category</th>
                <th>Power</th>
                <th>Accuracy</th>
            </tr>
        </div>
    </body>
</html>
